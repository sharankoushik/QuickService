<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickService - Forgot Password</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #111827, #0f766e);
            color: white;
        }

        header {
            background: #111827;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #fb923c;
            font-size: 30px;
        }

        header p {
            font-size: 16px;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 60px auto;
        }

        .box {
            background: white;
            color: #1f2937;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,.4);
        }

        h2 {
            text-align: center;
            color: #111827;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0d9488;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #0d9488;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0f766e;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #otpSection,
        #newPasswordSection {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }

        .success {
            display: block !important;
            background: #d1fae5;
            color: #047857;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #b91c1c;
        }

        .back {
            display: block;
            margin-top: 20px;
            padding: 12px;
            background: #6b7280;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .back:hover {
            background: #4b5563;
        }

        #recaptcha-container {
            margin: 15px 0;
        }

        .info {
            margin-top: 20px;
            padding: 12px;
            background: #f0fdfa;
            color: #0f766e;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
        }

    </style>

</head>


<body>


<header>

    <h1>⚡ QUICKSERVICE</h1>

    <p>All Home Services At One Stop</p>

</header>


<div class="container">

    <div class="box">

        <h2>🔑 Forgot Password?</h2>

        <p class="subtitle">

            Verify your registered phone number
            using OTP and create a new password.

        </p>


        <!-- PHONE NUMBER -->

        <div class="group">

            <label for="phone">

                📱 Registered Phone Number

            </label>

            <input
                type="tel"
                id="phone"
                maxlength="10"
                placeholder="Enter 10-digit phone number"
                autocomplete="tel">

        </div>


        <!-- FIREBASE reCAPTCHA -->

        <div id="recaptcha-container"></div>


        <!-- SEND OTP -->

        <button id="sendOtpBtn">

            Send OTP 📱

        </button>


        <!-- OTP SECTION -->

        <div id="otpSection">

            <div class="group">

                <label for="otp">

                    🔢 Enter OTP

                </label>

                <input
                    type="text"
                    id="otp"
                    maxlength="6"
                    placeholder="Enter 6-digit OTP"
                    inputmode="numeric">

            </div>


            <button id="verifyOtpBtn">

                Verify OTP ✓

            </button>

        </div>


        <!-- NEW PASSWORD -->

        <div id="newPasswordSection">

            <div class="group">

                <label for="newPassword">

                    🔒 New Password

                </label>

                <input
                    type="password"
                    id="newPassword"
                    minlength="6"
                    placeholder="Enter new password">

            </div>


            <div class="group">

                <label for="confirmNewPassword">

                    🔒 Confirm New Password

                </label>

                <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="Confirm new password">

            </div>


            <button id="changePasswordBtn">

                Change Password 🔐

            </button>

        </div>


        <!-- MESSAGE -->

        <div id="message"></div>


        <div class="info">

            💡 An OTP will be sent to your
            registered mobile number.

        </div>


        <!-- BACK -->

        <a
            href="pp.html"
            class="back">

            ← Back to Login

        </a>

    </div>

</div>



<!-- =========================================================
     FIREBASE
========================================================= -->

<script type="module">


    /*
    ============================================================
    IMPORT FIREBASE
    ============================================================
    */

    import {
        initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getAnalytics
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-analytics.js";


    import {
        getAuth,
        RecaptchaVerifier,
        signInWithPhoneNumber,
        updatePassword
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



    /*
    ============================================================
    YOUR FIREBASE CONFIGURATION

    THIS IS THE CONFIG YOU PROVIDED.
    ============================================================
    */

    const firebaseConfig = {

        apiKey:
            "AIzaSyDn15soeEJeuYfEvQyvzK-MKWZCuhgGx9g",

        authDomain:
            "quickservice-da485.firebaseapp.com",

        projectId:
            "quickservice-da485",

        storageBucket:
            "quickservice-da485.firebasestorage.app",

        messagingSenderId:
            "348321079075",

        appId:
            "1:348321079075:web:561fb3f738cb40023db696",

        measurementId:
            "G-Z7LXSELJK2"

    };



    /*
    ============================================================
    INITIALIZE FIREBASE
    ============================================================
    */

    const app =
        initializeApp(firebaseConfig);



    /*
    ============================================================
    INITIALIZE ANALYTICS
    ============================================================
    */

    const analytics =
        getAnalytics(app);



    /*
    ============================================================
    INITIALIZE AUTHENTICATION
    ============================================================
    */

    const auth =
        getAuth(app);



    /*
    ============================================================
    VARIABLES
    ============================================================
    */

    let confirmationResult = null;

    let verifiedUser = null;



    /*
    ============================================================
    HTML ELEMENTS
    ============================================================
    */

    const phone =
        document.getElementById("phone");

    const otp =
        document.getElementById("otp");

    const sendOtpBtn =
        document.getElementById("sendOtpBtn");

    const verifyOtpBtn =
        document.getElementById("verifyOtpBtn");

    const otpSection =
        document.getElementById("otpSection");

    const newPasswordSection =
        document.getElementById("newPasswordSection");

    const newPassword =
        document.getElementById("newPassword");

    const confirmNewPassword =
        document.getElementById("confirmNewPassword");

    const changePasswordBtn =
        document.getElementById("changePasswordBtn");

    const message =
        document.getElementById("message");



    /*
    ============================================================
    MESSAGE FUNCTION
    ============================================================
    */

    function showMessage(text, type) {

        message.innerHTML = text;

        message.className = type;

    }



    /*
    ============================================================
    RECAPTCHA
    ============================================================
    */

    const recaptchaVerifier =
        new RecaptchaVerifier(
            auth,
            "recaptcha-container",
            {
                size: "normal"
            }
        );



    /*
    ============================================================
    SEND OTP
    ============================================================
    */

    sendOtpBtn.addEventListener(
        "click",
        async function() {


            const phoneValue =
                phone.value.trim();



            /*
            VALIDATE PHONE
            */

            if (
                !/^[0-9]{10}$/.test(
                    phoneValue
                )
            ) {

                showMessage(
                    "❌ Enter a valid 10-digit Indian phone number.",
                    "error"
                );

                return;

            }



            sendOtpBtn.disabled = true;

            sendOtpBtn.innerText =
                "Sending OTP...";



            try {


                /*
                ADD INDIA COUNTRY CODE
                */

                const phoneNumber =
                    "+91" + phoneValue;



                /*
                SEND OTP
                */

                confirmationResult =
                    await signInWithPhoneNumber(
                        auth,
                        phoneNumber,
                        recaptchaVerifier
                    );



                /*
                SHOW OTP SECTION
                */

                otpSection.style.display =
                    "block";



                sendOtpBtn.innerText =
                    "OTP Sent ✓";



                showMessage(
                    "📱 OTP sent successfully. Check your phone and enter the 6-digit OTP.",
                    "success"
                );


            }

            catch (error) {


                console.error(
                    "Firebase Error:",
                    error
                );


                showMessage(
                    "❌ Firebase Error: " +
                    error.message,
                    "error"
                );


                sendOtpBtn.disabled =
                    false;


                sendOtpBtn.innerText =
                    "Send OTP 📱";

            }

        }
    );



    /*
    ============================================================
    VERIFY OTP
    ============================================================
    */

    verifyOtpBtn.addEventListener(
        "click",
        async function() {


            const otpValue =
                otp.value.trim();



            if (
                !/^[0-9]{6}$/.test(
                    otpValue
                )
            ) {

                showMessage(
                    "❌ Enter the 6-digit OTP.",
                    "error"
                );

                return;

            }



            if (!confirmationResult) {

                showMessage(
                    "❌ Please request an OTP first.",
                    "error"
                );

                return;

            }



            verifyOtpBtn.disabled =
                true;

            verifyOtpBtn.innerText =
                "Verifying...";



            try {


                /*
                VERIFY OTP
                */

                const result =
                    await confirmationResult
                        .confirm(
                            otpValue
                        );



                verifiedUser =
                    result.user;



                /*
                SHOW NEW PASSWORD
                */

                newPasswordSection.style.display =
                    "block";



                verifyOtpBtn.innerText =
                    "Phone Verified ✓";



                showMessage(
                    "✅ Phone verified successfully. You can now create a new password.",
                    "success"
                );


            }

            catch (error) {


                console.error(
                    "OTP Error:",
                    error
                );


                showMessage(
                    "❌ Invalid OTP. Please check the OTP and try again.",
                    "error"
                );


                verifyOtpBtn.disabled =
                    false;


                verifyOtpBtn.innerText =
                    "Verify OTP ✓";

            }

        }
    );



    /*
    ============================================================
    CHANGE PASSWORD
    ============================================================
    */

    changePasswordBtn.addEventListener(
        "click",
        async function() {


            const passwordValue =
                newPassword.value;


            const confirmValue =
                confirmNewPassword.value;



            /*
            PASSWORD LENGTH
            */

            if (
                passwordValue.length < 6
            ) {

                showMessage(
                    "❌ Password must contain at least 6 characters.",
                    "error"
                );

                return;

            }



            /*
            PASSWORD MATCH
            */

            if (
                passwordValue !==
                confirmValue
            ) {

                showMessage(
                    "❌ Passwords do not match.",
                    "error"
                );

                return;

            }



            /*
            USER CHECK
            */

            if (!verifiedUser) {

                showMessage(
                    "❌ Please verify your phone number first.",
                    "error"
                );

                return;

            }



            changePasswordBtn.disabled =
                true;

            changePasswordBtn.innerText =
                "Changing Password...";



            try {


                /*
                UPDATE PASSWORD
                */

                await updatePassword(
                    verifiedUser,
                    passwordValue
                );



                showMessage(
                    "✅ Password changed successfully! Redirecting to login...",
                    "success"
                );



                changePasswordBtn.innerText =
                    "Password Changed ✓";



                /*
                REDIRECT TO LOGIN
                */

                setTimeout(
                    function() {

                        window.location.href =
                            "pp.html";

                    },
                    2500
                );


            }

            catch (error) {


                console.error(
                    "Password Error:",
                    error
                );


                showMessage(
                    "❌ " +
                    error.message,
                    "error"
                );


                changePasswordBtn.disabled =
                    false;


                changePasswordBtn.innerText =
                    "Change Password 🔐";

            }

        }
    );


</script>


</body>

</html>
