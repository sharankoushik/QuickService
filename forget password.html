<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickService - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>QuickService</h1>
    <p>All home services at one stop</p>
</header>

<main>
    <div class="box">
        <h2>Forgot Password</h2>
        <p class="muted">Verify your phone number with an OTP, then set a new password.</p>

        <div id="phoneSection">
            <label for="phone">Registered Phone Number</label>
            <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10">

            <div id="recaptcha-container" style="margin-top:16px;"></div>

            <button type="button" id="sendOtpBtn" class="full">Send OTP</button>
        </div>

        <div id="otpSection" class="hidden">
            <label for="otp">Enter OTP</label>
            <input type="text" id="otp" placeholder="6-digit OTP" maxlength="6">
            <button type="button" id="verifyOtpBtn" class="full">Verify OTP</button>
        </div>

        <div id="newPasswordSection" class="hidden">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="At least 6 characters">

            <label for="confirmNewPassword">Confirm New Password</label>
            <input type="password" id="confirmNewPassword" placeholder="Confirm new password">

            <button type="button" id="changePasswordBtn" class="full">Change Password</button>
        </div>

        <div id="message"></div>

        <p class="small-link"><a href="pp.html">Back to Login</a></p>
    </div>
</main>

<footer>
    <p>&copy; 2026 QuickService. All rights reserved.</p>
    <p><a href="more.html">About Us</a> | <a href="copyright.html">Copyright Policy</a></p>
</footer>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import {
        getAuth,
        RecaptchaVerifier,
        signInWithPhoneNumber,
        updatePassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDn15soeEJeuYfEvQyvzK-MKWZCuhgGx9g",
        authDomain: "quickservice-da485.firebaseapp.com",
        projectId: "quickservice-da485",
        storageBucket: "quickservice-da485.firebasestorage.app",
        messagingSenderId: "348321079075",
        appId: "1:348321079075:web:561fb3f738cb40023db696",
        measurementId: "G-Z7LXSELJK2"
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    const recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", { size: "normal" });

    const message = document.getElementById("message");
    const otpSection = document.getElementById("otpSection");
    const newPasswordSection = document.getElementById("newPasswordSection");

    let confirmationResult = null;
    let verifiedUser = null;

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    // Step 1: send the OTP
    document.getElementById("sendOtpBtn").addEventListener("click", async function () {
        const phone = document.getElementById("phone").value.trim();

        if (!/^[0-9]{10}$/.test(phone)) {
            showMessage("Enter a valid 10-digit phone number.", "error");
            return;
        }

        try {
            confirmationResult = await signInWithPhoneNumber(auth, "+91" + phone, recaptchaVerifier);
            otpSection.classList.remove("hidden");
            showMessage("OTP sent. Check your phone.", "success");
        } catch (error) {
            showMessage("Could not send OTP: " + error.message, "error");
        }
    });

    // Step 2: check the OTP
    document.getElementById("verifyOtpBtn").addEventListener("click", async function () {
        const otp = document.getElementById("otp").value.trim();

        if (!/^[0-9]{6}$/.test(otp)) {
            showMessage("Enter the 6-digit OTP.", "error");
            return;
        }

        try {
            const result = await confirmationResult.confirm(otp);
            verifiedUser = result.user;
            newPasswordSection.classList.remove("hidden");
            showMessage("Phone verified. You can now set a new password.", "success");
        } catch (error) {
            showMessage("Wrong OTP. Please try again.", "error");
        }
    });

    // Step 3: change the password
    document.getElementById("changePasswordBtn").addEventListener("click", async function () {
        const password = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmNewPassword").value;

        if (password.length < 6) {
            showMessage("Password must have at least 6 characters.", "error");
            return;
        }
        if (password !== confirmPassword) {
            showMessage("Passwords do not match.", "error");
            return;
        }

        try {
            await updatePassword(verifiedUser, password);
            showMessage("Password changed. Redirecting to login...", "success");
            setTimeout(function () {
                window.location.href = "pp.html";
            }, 2500);
        } catch (error) {
            showMessage(error.message, "error");
        }
    });
</script>
</body>
</html>
