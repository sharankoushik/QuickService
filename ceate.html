<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickService - Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>QuickService</h1>
    <p>All home services at one stop</p>
</header>

<main>
    <div class="box">
        <h2>Create Account</h2>

        <form id="createForm">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" minlength="8" required>

            <div id="recaptcha-container" style="margin-top:16px;"></div>

            <button type="submit" id="sendOtpBtn" class="full">Send OTP</button>
        </form>

        <div id="otpSection" class="hidden">
            <p>Enter the 6-digit OTP sent to your phone.</p>
            <input type="text" id="otp" placeholder="6-digit OTP" maxlength="6">
            <button type="button" id="verifyBtn" class="full">Verify OTP and Create Account</button>
        </div>

        <div id="message"></div>

        <p class="small-link"><a href="pp.html">Back to Login</a></p>
    </div>
</main>

<footer>
    <p>&copy; 2026 QuickService. All rights reserved.</p>
    <p><a href="more.html">About Us</a> | <a href="copyright.html">Copyright Policy</a></p>
</footer>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import {
        getAuth,
        RecaptchaVerifier,
        signInWithPhoneNumber,
        createUserWithEmailAndPassword,
        sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDn15soeEJeuYfEvQyvzK-MKWZCuhgGx9g",
        authDomain: "quickservice-da485.firebaseapp.com",
        projectId: "quickservice-da485",
        storageBucket: "quickservice-da485.firebasestorage.app",
        messagingSenderId: "348321079075",
        appId: "1:348321079075:web:561fb3f738cb40023db696",
        measurementId: "G-Z7LXSELJK2"
    };

    const auth = getAuth(initializeApp(firebaseConfig));

    const message = document.getElementById("message");
    const otpSection = document.getElementById("otpSection");

    let confirmationResult = null;
    let recaptchaVerifier = null;
    let savedEmail = "";
    let savedPassword = "";

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    function setupRecaptcha() {
        if (recaptchaVerifier) {
            recaptchaVerifier.clear();
        }
        recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", { size: "normal" });
    }

    setupRecaptcha();

    // Only allow digits in phone and OTP boxes
    document.getElementById("phone").addEventListener("input", function () {
        this.value = this.value.replace(/[^0-9]/g, "");
    });
    document.getElementById("otp").addEventListener("input", function () {
        this.value = this.value.replace(/[^0-9]/g, "");
    });

    // Step 1: check the form and send the OTP
    document.getElementById("createForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (!/^[0-9]{10}$/.test(phone)) {
            showMessage("Enter a valid 10-digit mobile number.", "error");
            return;
        }
        if (password.length < 8) {
            showMessage("Password must have at least 8 characters.", "error");
            return;
        }
        if (password !== confirmPassword) {
            showMessage("Passwords do not match.", "error");
            return;
        }

        try {
            confirmationResult = await signInWithPhoneNumber(auth, "+91" + phone, recaptchaVerifier);
            savedEmail = email;
            savedPassword = password;
            otpSection.classList.remove("hidden");
            showMessage("OTP sent to your phone.", "success");
        } catch (error) {
            showMessage("Could not send OTP: " + error.message, "error");
        }

        // The reCAPTCHA can only be used once, so make a new one
        setupRecaptcha();
    });

    // Step 2: check the OTP and create the account
    document.getElementById("verifyBtn").addEventListener("click", async function () {
        const otp = document.getElementById("otp").value.trim();

        if (!/^[0-9]{6}$/.test(otp)) {
            showMessage("Enter the 6-digit OTP.", "error");
            return;
        }

        try {
            await confirmationResult.confirm(otp);

            const result = await createUserWithEmailAndPassword(auth, savedEmail, savedPassword);
            await sendEmailVerification(result.user);

            showMessage("Account created. A verification link was sent to your email. Redirecting to login...", "success");
            setTimeout(function () {
                window.location.href = "pp.html";
            }, 3000);
        } catch (error) {
            if (error.code === "auth/invalid-verification-code") {
                showMessage("Incorrect OTP. Please try again.", "error");
            } else if (error.code === "auth/email-already-in-use") {
                showMessage("This email already has an account. Please log in.", "error");
            } else {
                showMessage(error.message, "error");
            }
        }
    });
</script>
</body>
</html>
